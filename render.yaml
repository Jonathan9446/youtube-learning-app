services:
  - type: web
    name: youtube-learning-app
    env: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend
      npm install
      npm run build
      mkdir -p ../backend/public
      cp -r build/* ../backend/public/
    startCommand: cd backend && uvicorn main:app --host=0.0.0.0 --port=$PORT
